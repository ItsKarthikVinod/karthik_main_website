<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e51b24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e51b24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b44"/>
      <stop offset="100%" stop-color="#e51b24"/>
    </linearGradient>
  </defs>

  <!-- Background square with subtle border -->
  <rect width="64" height="64" rx="14" fill="#0c0d14"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" stroke="#e51b24" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- K -->
  <line x1="13" y1="16" x2="13" y2="48" stroke="url(#kGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="30" y2="16" stroke="url(#kGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="30" y2="48" stroke="url(#kGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- V -->
  <line x1="34" y1="16" x2="43.5" y2="48" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.92"/>
  <line x1="53" y1="16" x2="43.5" y2="48" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.92"/>

  <!-- Accent dot between K and V -->
  <circle cx="32" cy="49" r="2.5" fill="#e51b24"/>
</svg>
